name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Generated files up to date, plugin symlinks in place
        run: python3 scripts/build.py --check

      - name: No broken links
        run: python3 scripts/check_links.py

      - name: Guardrail hook tests
        run: python3 scripts/test_guard.py

      - name: Agent harness tests and controls
        run: |
          python3 scripts/test_agent_harness.py
          python3 scripts/agent_harness.py --check

      - name: JSON files parse
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null

      - name: Plugin manifests validate
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.296  # pinned so a new release can't break CI; bump on purpose
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p"; done
